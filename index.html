    pBtn.addEventListener('click', () => {
      if (video.paused) {
        video.play();
        pBtn.textContent = '\u275A\u275A';
      } else {
        video.pause();
        pBtn.textContent = '\u25B6';
      }
    });
    skipBtn.addEventListener('click', () => {
      video.currentTime = 205;
    });
    video.addEventListener('timeupdate', () => {
      if (video.duration) {
        const pct = (video.currentTime / video.duration) * 100;
        sBar.value = pct;
        let m = Math.floor(video.currentTime / 60);
        let s = Math.floor(video.currentTime % 60);
        if (s < 10) s = '0' + s;
        tLbl.textContent = m + ':' + s;
        parseSubs(video.currentTime);
        if (video.currentTime >= 165 && video.currentTime <= 207) {
          skipBtn.classList.add('show');
        } else {
          skipBtn.classList.remove('show');
        }
        if (!extraDismissed && !creditsClicked && video.currentTime >= 398 && video.currentTime < 415) {
          if (!nextEpTriggered) {
            nextEpTriggered = true;
            countdownRemaining = 10000;
            countdownStartTime = Date.now();
            nextEpBtn.classList.add('show', 'filling');
            const fillEl = nextEpBtn.querySelector('.next-ep-fill');
            if (fillEl) {
              fillEl.style.transition = `width ${countdownRemaining}ms linear`;
              fillEl.style.width = '100%';
            }
            countdownTimeout = setTimeout(() => {
              window.location.href = nextEpBtn.href;
            }, countdownRemaining);
          }
        } else {
          if (nextEpTriggered && (video.currentTime < 398 || creditsClicked || extraDismissed)) {
            nextEpTriggered = false;
            clearTimeout(countdownTimeout);
            countdownTimeout = null;
            nextEpBtn.classList.remove('show', 'filling');
            const fillEl = nextEpBtn.querySelector('.next-ep-fill');
            if (fillEl) {
              fillEl.style.transition = 'none';
              fillEl.style.width = '0%';
            }
          }
        }
        if (!extraDismissed && !creditsClicked && video.currentTime >= 398) {
          extraBtn.classList.add('show');
        } else {
          extraBtn.classList.remove('show');
        }
        if (!extraDismissed && !creditsClicked && video.currentTime >= 409) {
          creditsBtn.classList.add('show');
        } else {
          creditsBtn.classList.remove('show');
        }
      }
    });
    extraBtn.addEventListener('click', () => {
      extraDismissed = true;
      sessionStorage.setItem('bfsw_extra_dismissed', 'true');
      clearTimeout(countdownTimeout);
      countdownTimeout = null;
      nextEpBtn.classList.remove('show', 'filling');
      extraBtn.classList.remove('show');
      creditsBtn.classList.remove('show');
      const fillEl = nextEpBtn.querySelector('.next-ep-fill');
      if (fillEl) {
        fillEl.style.transition = 'none';
        fillEl.style.width = '0%';
      }
    });
    creditsBtn.addEventListener('click', () => {
      creditsClicked = true;
      clearTimeout(countdownTimeout);
      countdownTimeout = null;
      nextEpBtn.classList.remove('show', 'filling');
      extraBtn.classList.remove('show');
      creditsBtn.classList.remove('show');
      const fillEl = nextEpBtn.querySelector('.next-ep-fill');
      if (fillEl) {
        fillEl.style.transition = 'none';
        fillEl.style.width = '0%';
      }
    });
    video.addEventListener('ended', () => {
      pBtn.textContent = '\u25B6';
      skipBtn.classList.remove('show');
      nextEpBtn.classList.remove('show', 'filling');
      extraBtn.classList.remove('show');
      creditsBtn.classList.remove('show');
      clearTimeout(countdownTimeout);
      countdownTimeout = null;
    });
    function parseSubs(t) {
      if (!ccOn) {
        lineZero.textContent = "";
        fsTxt.textContent = "";
        fsTxt.style.display = 'none';
        lineMinus1.textContent = "";
        lineMinus2.textContent = "";
        linePlus1.textContent = "";
        linePlus2.textContent = "";
        return;
      }
      let idx = -1;
      for (let i = 0; i < subs.length; i++) {
        if (t >= subs[i].start && t < subs[i].end) {
          idx = i;
          break;
        }
      }
      if (idx !== -1) {
        const txt = subs[idx].text;
        lineZero.textContent = txt;
        fsTxt.textContent = txt;
        fsTxt.style.display = 'inline-block';
        lineMinus1.textContent = idx > 0 ? subs[idx - 1].text : "";
        lineMinus2.textContent = idx > 1 ? subs[idx - 2].text : "";
        linePlus1.textContent = idx < subs.length - 1 ? subs[idx + 1].text : "";
        linePlus2.textContent = idx < subs.length - 2 ? subs[idx + 2].text : "";
      } else {
        lineZero.textContent = "";
        fsTxt.textContent = "";
        fsTxt.style.display = 'none';
        lineMinus1.textContent = "";
        lineMinus2.textContent = "";
        linePlus1.textContent = "";
        linePlus2.textContent = "";
      }
    }
    ccBtn.addEventListener('click', () => {
      ccOn = !ccOn;
      if (ccOn) {
        ccBtn.classList.remove('off');
        subWrap.style.display = (document.fullscreenElement || document.webkitFullscreenElement || box.classList.contains('mobile-fullscreen')) ? 'none' : 'flex';
        parseSubs(video.currentTime);
      } else {
        ccBtn.classList.add('off');
        subWrap.style.display = 'none';
        fsTxt.textContent = "";
        fsTxt.style.display = 'none';
        lineZero.textContent = "";
        lineMinus1.textContent = "";
        lineMinus2.textContent = "";
        linePlus1.textContent = "";
        linePlus2.textContent = "";
      }
    });
    sBar.addEventListener('input', () => {
      if (video.duration) {
        video.currentTime = (sBar.value / 100) * video.duration;
        if (video.currentTime < 409) {
          creditsClicked = false;
        }
      }
    });
    fBtn.addEventListener('click', () => {
      const isFs = document.fullscreenElement || document.webkitFullscreenElement || box.classList.contains('mobile-fullscreen');
      if (!isFs) {
        if (box.requestFullscreen) {
          box.requestFullscreen().catch(() => {
            box.classList.add('mobile-fullscreen');
            updateFsState();
          });
        } else if (box.webkitRequestFullscreen) {
          box.webkitRequestFullscreen();
        } else {
          box.classList.add('mobile-fullscreen');
          updateFsState();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {
            box.classList.remove('mobile-fullscreen');
            updateFsState();
          });
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else {
          box.classList.remove('mobile-fullscreen');
          updateFsState();
        }
      }
    });
    function updateFsState() {
      const isFs = document.fullscreenElement || document.webkitFullscreenElement || box.classList.contains('mobile-fullscreen');
      if (isFs) {
        subWrap.style.display = 'none';
      } else {
        if (ccOn) {
          subWrap.style.display = 'flex';
        }
      }
    }
    document.addEventListener('fullscreenchange', updateFsState);
    document.addEventListener('webkitfullscreenchange', updateFsState);
  })();
</script>
